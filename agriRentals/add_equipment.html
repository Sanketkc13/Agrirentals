<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Equipment - AgriRentals</title>
    <link rel="stylesheet" href="add_equipment.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <section id="menu">
            <div class="logo">
                <img src="images/logo.png" alt="AgriRentals Logo">
                <h2>AgriRentals</h2>
            </div>
            <ul class="items">
                <li><i class="fas fa-chart-pie"></i><a href="admin.html">Dashboard</a></li>
                <li><i class="fas fa-chart-line"></i><a href="add_equipment.html">Equipment</a></li>
                <li><i class="fas fa-table-list"></i><a href="admin_page.php">Users</a></li>
                <li><i class="fas fa-suitcase"></i><a href="admin_service.php">Our Equipment</a></li>
            </ul>
        </section>
    </nav>

    <div class="admin-container">
        <h1>Add New Equipment</h1>
        <form id="equipmentForm" enctype="multipart/form-data">
            <div>
                <label for="name">Equipment Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="description">Description:</label>
                <textarea id="description" name="description" required></textarea>
            </div>

            <div>
                <label for="price">Renting Price:</label>
                <input type="number" id="price" name="price" step="0.01" required>
            </div>

            <div>
                <label for="image">Upload Image:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
                <img id="imagePreview" src="#" alt="Image Preview" style="display:none; width: 100px; height: auto; margin-top: 10px;">
            </div>

            <button type="submit">Add Equipment</button>
        </form>
        <div id="responseMessage" style="margin-top: 20px;"></div>
    </div>

    <script>
        // Image preview functionality
        document.getElementById('image').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const imagePreview = document.getElementById('imagePreview');
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
            }
            if (file) {
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('equipmentForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            const formData = new FormData(this); 

            fetch('add_equipment.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('responseMessage').innerText = "Equipment added successfully!";
                this.reset();
                document.getElementById('imagePreview').style.display = 'none'; // Hide the image preview
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('responseMessage').innerText = "An error occurred while adding equipment.";
            });
        });
    </script>
</body>
</html>
